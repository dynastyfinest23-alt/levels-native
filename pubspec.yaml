name: levels_native
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  go_router: ^17.3.0
  supabase_flutter: ^2.15.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # design-system/MASTER.md §3, §7: bundled OFL asset fonts. Each entry below
  # points a `weight:` at the same variable-font file so Flutter resolves the
  # matching `wght` axis instance — no static per-weight files needed, and no
  # `google_fonts` package (forbidden).
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 400
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 500
        - asset: assets/fonts/Inter-Variable.ttf
          weight: 600
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf
          weight: 300
        - asset: assets/fonts/Fraunces-Variable.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-Italic-Variable.ttf
          weight: 300
          style: italic
