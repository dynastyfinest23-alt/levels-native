# Purpose: gate every PR into main (and every push to main) on the same checks
# CLAUDE.md's Definition of done requires: flutter analyze clean, flutter test passing.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    # embodiment_gate_test's local-vs-UTC case only discriminates west of UTC;
    # runners default to UTC. Match the dev machine (US Central).
    env:
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
